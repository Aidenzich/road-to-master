<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc"><title id="title">H3 RefMod: reference injection architecture</title><desc id="desc">A saved VAE reference latent enters the conditioning payload. Each model evaluation packs projected reference, text and target video tokens for DiT attention. The sampler updates only the target latent and the final video latent is VAE decoded.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#424955"/></marker><marker id="blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#356a9c"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#202631}.title{font-size:32px;font-weight:700}.panel{font-size:21px;font-weight:700;letter-spacing:1px}.label{font-size:23px;font-weight:600}.sub{font-size:19px;fill:#4d5866}.tiny{font-size:17px;fill:#4d5866}.edge{fill:none;stroke:#424955;stroke-width:2.4;marker-end:url(#arrow)}.loop{fill:none;stroke:#356a9c;stroke-width:2.8;stroke-dasharray:9 6;marker-end:url(#blue)}.box{stroke:#697482;stroke-width:1.8;rx:9}.ref{fill:#fff0df;stroke:#b87b35}.txt{fill:#f1edfa;stroke:#8973af}.target{fill:#eaf3fb;stroke:#5e8ab2}</style></defs><rect width="1800" height="1120" fill="white"/><text class="title" x="44" y="43">H3 / RefMod — where does the reference enter?</text><rect x="40" y="70" width="1720" height="180" rx="12" fill="#fbfcfd" stroke="#aab3bd" stroke-width="1.7" stroke-dasharray="8 5"/><text x="65" y="105" class="panel" text-anchor="start">A  REFERENCE PREPARATION  /  ONCE PER ASSET</text><rect x="80" y="135" width="260" height="80" class="box " fill="#fff"/><text x="210.0" y="172.0" class="label" text-anchor="middle">Reference media</text><text x="210.0" y="201.0" class="sub" text-anchor="middle">image / video pixels</text><path d="M340 175H385" class="edge"/><rect x="385" y="135" width="230" height="80" class="box " fill="#fff"/><text x="500.0" y="172.0" class="label" text-anchor="middle">VAE encoder</text><text x="500.0" y="201.0" class="sub" text-anchor="middle">pixels → latent</text><path d="M615 175H660" class="edge"/><rect x="660" y="135" width="240" height="80" class="box ref" fill="#fff"/><text x="780.0" y="172.0" class="label" text-anchor="middle">Reference latent</text><text x="780.0" y="201.0" class="sub" text-anchor="middle">z_ref  ·  visual content</text><path d="M900 175H945" class="edge"/><rect x="945" y="135" width="350" height="80" class="box ref" fill="#fff"/><text x="1120.0" y="172.0" class="label" text-anchor="middle">Optional latent compression</text><text x="1120.0" y="201.0" class="sub" text-anchor="middle">pooling + reconstruction refinement</text><path d="M1295 175H1370" class="edge"/><rect x="1370" y="135" width="350" height="80" class="box ref" fill="#fff"/><text x="1545.0" y="172.0" class="label" text-anchor="middle">RefMod file</text><text x="1545.0" y="201.0" class="sub" text-anchor="middle">latent + metadata</text><text x="870" y="273" class="tiny" text-anchor="middle">Saved asset is loaded again for a new generation</text><rect x="40" y="325" width="1720" height="725" rx="12" fill="#fff" stroke="#aab3bd" stroke-width="1.7"/><text x="65" y="361" class="panel" text-anchor="start">B  GENERATION  /  EVERY MODEL EVALUATION</text><path d="M1545 215V281H55V385H180V405" class="edge"/><rect x="80" y="405" width="200" height="100" class="box ref" fill="#fff"/><text x="180.0" y="452.0" class="label" text-anchor="middle">Load + Apply</text><text x="180.0" y="481.0" class="sub" text-anchor="middle">refs / minimax_refs</text><path d="M280 455H340" class="edge"/><rect x="340" y="405" width="255" height="100" class="box ref" fill="#fff"/><text x="467.5" y="452.0" class="label" text-anchor="middle">Patchify + project</text><text x="467.5" y="481.0" class="sub" text-anchor="middle">cond_video_latents</text><path d="M595 455H655" class="edge"/><rect x="80" y="565" width="200" height="100" class="box " fill="#fff"/><text x="180.0" y="612.0" class="label" text-anchor="middle">New prompt</text><text x="180.0" y="641.0" class="sub" text-anchor="middle">text</text><path d="M280 615H340" class="edge"/><rect x="340" y="565" width="255" height="100" class="box txt" fill="#fff"/><text x="467.5" y="612.0" class="label" text-anchor="middle">Text encoder</text><text x="467.5" y="641.0" class="sub" text-anchor="middle">+ condition projection</text><path d="M595 615H655" class="edge"/><rect x="80" y="725" width="200" height="100" class="box target" fill="#fff"/><text x="180.0" y="772.0" class="label" text-anchor="middle">Target latent x_t</text><text x="180.0" y="801.0" class="sub" text-anchor="middle">initially noise*</text><path d="M280 775H340" class="edge"/><rect x="340" y="725" width="255" height="100" class="box target" fill="#fff"/><text x="467.5" y="772.0" class="label" text-anchor="middle">Patchify + project</text><text x="467.5" y="801.0" class="sub" text-anchor="middle">video_patch_proj</text><path d="M595 775H655" class="edge"/><rect x="655" y="395" width="270" height="440" rx="12" fill="#fafbfc" stroke="#697482" stroke-width="1.7"/><text x="790" y="430" class="panel" text-anchor="middle">PACKED TOKENS</text><rect x="675" y="448" width="230" height="65" class="box ref" fill="#fff"/><text x="790.0" y="487.5" class="label" text-anchor="middle">Reference tokens</text><rect x="675" y="580" width="230" height="65" class="box txt" fill="#fff"/><text x="790.0" y="619.5" class="label" text-anchor="middle">Text tokens</text><rect x="675" y="712" width="230" height="65" class="box target" fill="#fff"/><text x="790.0" y="751.5" class="label" text-anchor="middle">Target video tokens</text><text x="790" y="812" class="tiny" text-anchor="middle">layout + positional encoding</text><path d="M925 615H980" class="edge"/><rect x="990" y="490" width="250" height="235" rx="12" fill="#edf2f4" stroke="#697482" stroke-width="1.7"/><rect x="983" y="482" width="250" height="235" rx="12" fill="#f5f8f9" stroke="#697482" stroke-width="1.7"/><rect x="975" y="474" width="250" height="235" rx="12" fill="#fff" stroke="#424955" stroke-width="1.7"/><text x="1100" y="532" class="title" text-anchor="middle">H3 DiT</text><text x="1100" y="570" class="label" text-anchor="middle">Attention + MLP</text><text x="1100" y="606" class="sub" text-anchor="middle">reference ↔ target</text><text x="1100" y="644" class="sub" text-anchor="middle">N transformer blocks</text><text x="1100" y="684" class="tiny" text-anchor="middle">shared token sequence</text><rect x="985" y="385" width="230" height="60" class="box " fill="#fff"/><text x="1100.0" y="422.0" class="label" text-anchor="middle">Timestep t</text><path d="M1100 445V470" class="edge"/><path d="M1235 615H1280" class="edge"/><rect x="1280" y="557" width="205" height="116" class="box " fill="#fff"/><text x="1382.5" y="612.0" class="label" text-anchor="middle">Target prediction</text><text x="1382.5" y="641.0" class="sub" text-anchor="middle">velocity / update</text><path d="M1485 615H1520" class="edge"/><rect x="1520" y="557" width="200" height="116" class="box target" fill="#fff"/><text x="1620.0" y="612.0" class="label" text-anchor="middle">Sampler</text><text x="1620.0" y="641.0" class="sub" text-anchor="middle">update x_t</text><path d="M1580 673V870H465V830" class="loop"/><text x="1015" y="858" class="sub" text-anchor="middle">REPEAT: updated target latent → next model evaluation</text><text x="1015" y="897" class="tiny" text-anchor="middle">Reference is conditioning; it is not the target being denoised.</text><path d="M1660 673V932" class="edge"/><text x="1695" y="873" class="tiny" text-anchor="middle">done</text><rect x="1510" y="932" width="220" height="82" class="box target" fill="#fff"/><text x="1620.0" y="970.0" class="label" text-anchor="middle">Final video latent</text><text x="1620.0" y="999.0" class="sub" text-anchor="middle">x_final</text><path d="M1510 973H1455" class="edge"/><rect x="1205" y="932" width="250" height="82" class="box " fill="#fff"/><text x="1330.0" y="970.0" class="label" text-anchor="middle">VAE decoder</text><text x="1330.0" y="999.0" class="sub" text-anchor="middle">latent → pixels</text><path d="M1205 973H1150" class="edge"/><rect x="920" y="932" width="230" height="82" class="box " fill="#fff"/><text x="1035.0" y="970.0" class="label" text-anchor="middle">Output frames</text><text x="1035.0" y="999.0" class="sub" text-anchor="middle">video encoding</text><text x="80" y="1090" class="tiny" text-anchor="start">* Keyframe / image conditioning and the audio stream are omitted. Token order is schematic. RefMod Text Encode is an alternative to Apply.</text></svg>