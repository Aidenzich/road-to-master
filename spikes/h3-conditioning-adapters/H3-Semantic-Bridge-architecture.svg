<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc"><title id="title">H3 Semantic Bridge: conditioning-space adapter</title><desc id="desc">The original H3 conditioning H branches into an unchanged skip path and an RMS normalized MLP path. The transformed result is magnitude matched, then mixed as C equals H plus alpha times S minus H. C feeds the native model text conditioning path. Video latent generation and VAE decoding remain separate.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#424955"/></marker><marker id="blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#356a9c"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#202631}.title{font-size:32px;font-weight:700}.panel{font-size:21px;font-weight:700;letter-spacing:1px}.label{font-size:23px;font-weight:600}.sub{font-size:19px;fill:#4d5866}.tiny{font-size:17px;fill:#4d5866}.edge{fill:none;stroke:#424955;stroke-width:2.4;marker-end:url(#arrow)}.loop{fill:none;stroke:#356a9c;stroke-width:2.8;stroke-dasharray:9 6;marker-end:url(#blue)}.box{stroke:#697482;stroke-width:1.8;rx:9}.ref{fill:#fff0df;stroke:#b87b35}.txt{fill:#f1edfa;stroke:#8973af}.target{fill:#eaf3fb;stroke:#5e8ab2}</style></defs><rect width="1800" height="1180" fill="white"/><text x="44" y="43" class="title" text-anchor="start">H3 / Semantic Bridge — transform the conditioning, not the video latent</text><rect x="50" y="75" width="1700" height="160" rx="12" fill="#fbfcfd" stroke="#aab3bd" stroke-width="1.7"/><text x="75" y="105" class="panel" text-anchor="start">A  NATIVE CONDITIONING</text><rect x="90" y="130" width="220" height="80" class="box " fill="#fff"/><text x="200.0" y="167.0" class="label" text-anchor="middle">Prompt</text><text x="200.0" y="196.0" class="sub" text-anchor="middle">text</text><path d="M310 170H360" class="edge"/><rect x="360" y="130" width="270" height="80" class="box " fill="#fff"/><text x="495.0" y="167.0" class="label" text-anchor="middle">H3 text encoder</text><text x="495.0" y="196.0" class="sub" text-anchor="middle">native encoding</text><path d="M630 170H680" class="edge"/><rect x="680" y="130" width="240" height="80" class="box txt" fill="#fff"/><text x="800.0" y="167.0" class="label" text-anchor="middle">Original H</text><text x="800.0" y="196.0" class="sub" text-anchor="middle">[B, T, 5120]</text><path d="M920 170H970" class="edge"/><circle cx="970" cy="170" r="5" fill="#424955"/><rect x="50" y="315" width="1700" height="430" rx="12" fill="#fff" stroke="#aab3bd" stroke-width="1.7" stroke-dasharray="8 5"/><text x="75" y="350" class="panel" text-anchor="start">B  SEMANTIC BRIDGE v1</text><path d="M970 170V270H65V385H215V395" class="edge"/><text x="420" y="260" class="sub" text-anchor="middle">transform path</text><path d="M970 170H1650V595" class="edge"/><text x="1440" y="157" class="sub" text-anchor="middle">original H / skip connection</text><rect x="90" y="400" width="250" height="95" class="box txt" fill="#fff"/><text x="215.0" y="444.5" class="label" text-anchor="middle">RMS normalize</text><text x="215.0" y="473.5" class="sub" text-anchor="middle">per conditioning token</text><path d="M340 447H400" class="edge"/><rect x="400" y="400" width="380" height="95" class="box ref" fill="#fff"/><text x="590.0" y="444.5" class="label" text-anchor="middle">Adapter / student MLP</text><text x="590.0" y="473.5" class="sub" text-anchor="middle">5120 → 512 → 512 → 5120</text><text x="590" y="524" class="tiny" text-anchor="middle">11 MB learned weights · SiLU</text><path d="M780 447H850" class="edge"/><rect x="850" y="400" width="320" height="95" class="box txt" fill="#fff"/><text x="1010.0" y="444.5" class="label" text-anchor="middle">Magnitude match</text><text x="1010.0" y="473.5" class="sub" text-anchor="middle">per-token RMS → original H</text><path d="M1170 447H1240" class="edge"/><rect x="1240" y="400" width="200" height="95" class="box txt" fill="#fff"/><text x="1340.0" y="444.5" class="label" text-anchor="middle">Transformed S</text><text x="1340.0" y="473.5" class="sub" text-anchor="middle">[B, T, 5120]</text><path d="M1440 447H1510V595" class="edge"/><text x="1435" y="556" class="label" text-anchor="middle">S</text><text x="1683" y="556" class="label" text-anchor="middle">H</text><rect x="1420" y="600" width="300" height="110" class="box txt" fill="#fff"/><text x="1570.0" y="652.0" class="label" text-anchor="middle">Residual blend</text><text x="1570.0" y="681.0" class="sub" text-anchor="middle">C = H + α (S − H)</text><text x="710" y="611" class="label" text-anchor="middle">α = 0.10 starting point  ·  per_token matching</text><text x="710" y="650" class="sub" text-anchor="middle">α = 0 preserves H; α is not a quality percentage.</text><text x="710" y="690" class="tiny" text-anchor="middle">Same token count / feature width; conditioning metadata is copied.</text><path d="M1570 710V778H65V870H90" class="edge"/><text x="75" y="805" class="panel" text-anchor="start">C  EXISTING MODEL / SAMPLING PATH</text><rect x="90" y="825" width="340" height="95" class="box txt" fill="#fff"/><text x="260.0" y="869.5" class="label" text-anchor="middle">New conditioning C</text><text x="260.0" y="898.5" class="sub" text-anchor="middle">[B, T, 5120]</text><path d="M430 872H480" class="edge"/><rect x="480" y="825" width="300" height="95" class="box txt" fill="#fff"/><text x="630.0" y="869.5" class="label" text-anchor="middle">Native text projection</text><text x="630.0" y="898.5" class="sub" text-anchor="middle">condition_proj / token_refiner</text><path d="M780 872H850" class="edge"/><rect x="860" y="837" width="300" height="135" rx="12" fill="#edf2f4" stroke="#697482" stroke-width="1.7"/><rect x="855" y="831" width="300" height="135" rx="12" fill="#f5f8f9" stroke="#697482" stroke-width="1.7"/><rect x="850" y="825" width="300" height="135" rx="12" fill="#fff" stroke="#424955" stroke-width="1.7"/><text x="1000" y="867" class="title" text-anchor="middle">H3 DiT</text><text x="1000" y="906" class="sub" text-anchor="middle">text + target video tokens</text><text x="1000" y="940" class="tiny" text-anchor="middle">timestep-conditioned blocks</text><path d="M1160 872H1230" class="edge"/><rect x="1230" y="825" width="250" height="95" class="box target" fill="#fff"/><text x="1355.0" y="869.5" class="label" text-anchor="middle">Prediction / sampler</text><text x="1355.0" y="898.5" class="sub" text-anchor="middle">update target x_t</text><path d="M1480 872H1520" class="edge"/><rect x="1520" y="825" width="220" height="95" class="box " fill="#fff"/><text x="1630.0" y="869.5" class="label" text-anchor="middle">VAE decoder</text><text x="1630.0" y="898.5" class="sub" text-anchor="middle">final latent → frames</text><text x="1630" y="961" class="tiny" text-anchor="middle">after sampling finishes</text><rect x="850" y="1010" width="300" height="80" class="box target" fill="#fff"/><text x="1000.0" y="1047.0" class="label" text-anchor="middle">Target video latent x_t</text><text x="1000.0" y="1076.0" class="sub" text-anchor="middle">initial noise / updated latent</text><path d="M1000 1010V975" class="edge"/><path d="M1355 920V1050H1155" class="loop"/><text x="1350" y="1030" class="sub" text-anchor="middle">repeat model evaluation</text><text x="80" y="1133" class="tiny" text-anchor="start">Teacher targets: SenseNova U1.5 + learned projection (training only; neither is loaded in this inference graph).</text><text x="80" y="1161" class="tiny" text-anchor="start">Scope: standard FL2VA conditioning path; v1 does not support Ref2VA. Keyframes, audio and other model patches are omitted.</text></svg>